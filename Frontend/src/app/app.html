<header class="topbar">
  <div class="topbar-inner">

        <rect x="3" y="3" width="18" height="18" rx="5" />

      </svg>

<main class="page">

    <aside class="side">
      <app-submission-panel />
      <app-delivery-simulator />

  </div>
</main>
